<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo job application</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 640px;
        margin: 32px auto;
        color: #0f172a;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
      }
      button {
        margin-top: 18px;
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <h1>Acme intern role</h1>
    <form>
      <label for="first">First name</label>
      <input id="first" name="first_name" autocomplete="given-name" />

      <label for="last">Last name</label>
      <input id="last" name="last_name" autocomplete="family-name" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="linkedin">LinkedIn URL</label>
      <input id="linkedin" name="linkedin" type="url" />

      <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
      <select id="sponsor" name="sponsorship">
        <option value=""></option>
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />

      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why"></textarea>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo cover letter prompt</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 640px;
        margin: 32px auto;
        color: #0f172a;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Apply to Globex</h1>
    <section class="job-description">
      Globex builds climate software for cities. The role is a product intern helping ship onboarding experiments.
    </section>
    <form>
      <div>
        <div>What interests you about working for this company?</div>
        <textarea name="note"></textarea>
      </div>
    </form>
  </body>
</html>
